# Upstream buckets this bucket tracks, one per line: <local clone path>;<git remote>
# %SCOOP_CONTROLLED_SOURCES% is the folder holding your clones; set it as an environment variable.
# '.\Update-Bucket.ps1 -PullSources' clones any missing entry to the path given here, then pulls them all.
%SCOOP_CONTROLLED_SOURCES%\scoop-main;git@github.com:ScoopInstaller/Main.git
%SCOOP_CONTROLLED_SOURCES%\scoop-extras;git@github.com:ScoopInstaller/Extras.git
%SCOOP_CONTROLLED_SOURCES%\scoop-nonportable;git@github.com:ScoopInstaller/Nonportable.git
%SCOOP_CONTROLLED_SOURCES%\scoop-games;git@github.com:Calinou/scoop-games
%SCOOP_CONTROLLED_SOURCES%\scoop-versions;git@github.com:ScoopInstaller/Versions.git
%SCOOP_CONTROLLED_SOURCES%\ScoopMaster;git@github.com:okibcn/ScoopMaster
